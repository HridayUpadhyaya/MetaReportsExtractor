name: Update Meta India reports

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Reprocess all previously seen reports"
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 08:47 India time (03:17 UTC), deliberately away from the top of the hour.
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: meta-india-report-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-free.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-free.txt

      - name: Install Chromium for Meta discovery fallback
        run: python -m playwright install --with-deps chromium

      - name: Update India reports
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.rebuild_all }}" == "true" ]]; then
            python -m app.free_runner --rebuild
          else
            python -m app.free_runner
          fi

      - name: Commit updated dataset and spreadsheet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free_state.json docs/
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "chore: update Meta India reports"
            git push
          fi
